[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-arena"
version = "0.1.0"
description = "Benchmark LLM forecasting architectures head-to-head."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forecast_arena"]
